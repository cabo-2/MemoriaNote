name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Test repository scripts
        run: python -m unittest discover --start-directory .github/scripts/tests --pattern "test_*.py"

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore MemoriaNote.sln

      - name: Build solution
        run: dotnet build MemoriaNote.sln --configuration Release --no-restore

      - name: Run full test suite
        run: dotnet test MemoriaNote.sln --configuration Release --no-build
