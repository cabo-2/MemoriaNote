name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 6.0.x

      - name: Restore dependencies
        run: dotnet restore MemoriaNote.sln

      - name: Build solution
        run: dotnet build MemoriaNote.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test MemoriaNote.sln --configuration Release --no-build
