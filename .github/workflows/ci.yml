name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            executable: mn
          - os: windows-latest
            rid: win-x64
            executable: mn.exe

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true
      ARTIFACT_TEST_TAG: v0.0.0
      ARTIFACT_TEST_VERSION: 0.0.0

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Test repository scripts
        run: python -m unittest discover --start-directory .github/scripts/tests --pattern "test_*.py"

      - name: Test performance workflow
        run: python -m unittest discover --start-directory performance/scripts/tests --pattern "test_*.py"

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore MemoriaNote.sln

      - name: Build solution
        run: dotnet build MemoriaNote.sln --configuration Release --no-restore

      - name: Run full test suite
        run: dotnet test MemoriaNote.sln --configuration Release --no-build

      # Keep synthetic package verification in ordinary CI as a release regression gate.
      - name: Package self-contained release artifact
        run: >-
          python .github/scripts/package-release.py
          --tag "${{ env.ARTIFACT_TEST_TAG }}"
          --rid "${{ matrix.rid }}"

      - name: Verify publish directory and release archive
        run: >-
          python .github/scripts/verify-release-artifacts.py package
          --package-results "artifacts/release/${{ env.ARTIFACT_TEST_TAG }}/package-results.json"
          --publish-executable "artifacts/release/${{ env.ARTIFACT_TEST_TAG }}/publish/${{ matrix.rid }}/${{ matrix.executable }}"
          --rid "${{ matrix.rid }}"
          --expected-version "${{ env.ARTIFACT_TEST_VERSION }}"
          --cleanup-on-failure
